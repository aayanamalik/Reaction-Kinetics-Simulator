[project]
name = "reactions"
version = "0.1.0"
description = "Stiff ODE modelling of chemical reaction kinetics in Python using implicit adaptive solvers (SciPy Radau)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "scipy>=1.11",
    "numpy>=2.0"
]

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"